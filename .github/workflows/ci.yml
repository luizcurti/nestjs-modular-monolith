name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # "Run workflow" on main re-runs the pipeline and deploys, e.g. to recreate the stack after
  # the Destroy workflow.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main mid-deploy (it could leave a Terraform state lock behind).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    services:
      postgres:
        image: postgres:11.8
        env:
          POSTGRES_PASSWORD: qso_password
          POSTGRES_USER: qso_user
          POSTGRES_DB: qso_example
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_DATASOURCE: typeorm
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      TYPEORM_TYPE: postgres
      TYPEORM_HOST: localhost
      TYPEORM_PORT: 5432
      TYPEORM_USERNAME: qso_user
      TYPEORM_PASSWORD: qso_password
      TYPEORM_DATABASE: qso_example
      MONGODB_URL: mongodb://localhost:27017/users_management_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # STATIC ANALYSIS
      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      # TESTS — unit / integration / e2e (three independent layers, see docs/mmd/testing-strategy.mmd)
      - name: Run unit tests with coverage
        run: npm run test:cov -- --passWithNoTests

      - name: Run integration tests (real PostgreSQL + MongoDB)
        run: npm run test:integration

      - name: Run e2e tests (SQLite in-memory)
        run: npm run test:e2e

      - name: Run e2e tests (real PostgreSQL)
        run: npm run test:e2e:docker

      # SECURITY
      - name: Security audit
        run: |
          echo "Running security audit..."
          npm audit || echo "Security vulnerabilities found - review required but CI continues"
        continue-on-error: true

      # BUILD
      - name: Build application
        run: npm run build

      # COLLECTION — boot the built app and replay the Postman collection against it
      - name: Boot application in the background
        run: |
          node dist/main.js &
          echo $! > app.pid
          npx wait-on http://localhost:3000/v1/credit --timeout 30000

      - name: Run Postman collection (Newman)
        run: npx --yes newman run docs/postman/nestjs-modular-monolith.postman_collection.json

      - name: Stop application
        if: always()
        run: kill "$(cat app.pid)" || true

      # DOCKER
      - name: Test Docker build
        run: docker build -t nestjs-modular-monolith .

      - name: Test Docker Compose
        run: docker compose config

      - name: Boot Docker image and verify health
        run: |
          docker run -d --name app-docker-validate \
            --add-host=host.docker.internal:host-gateway \
            -p 3000:3000 \
            -e DATABASE_DATASOURCE=typeorm \
            -e TYPEORM_TYPE=postgres \
            -e TYPEORM_HOST=host.docker.internal \
            -e TYPEORM_PORT=5432 \
            -e TYPEORM_USERNAME=qso_user \
            -e TYPEORM_PASSWORD=qso_password \
            -e TYPEORM_DATABASE=qso_example \
            -e REDIS_HOST=host.docker.internal \
            -e REDIS_PORT=6379 \
            -e MONGODB_URL=mongodb://host.docker.internal:27017/users_management_ci \
            nestjs-modular-monolith
          npx wait-on http://localhost:3000/v1/credit --timeout 30000
          for i in $(seq 1 10); do
            status="$(docker inspect --format='{{.State.Health.Status}}' app-docker-validate)"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker logs app-docker-validate
          docker inspect --format='{{.State.Health.Status}}' app-docker-validate | grep -q healthy

      - name: Stop Docker image
        if: always()
        run: docker rm -f app-docker-validate || true

  infra:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: infra/
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: bootstrap/
        working-directory: bootstrap
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # Deploys to real AWS on every push to main (or a manual run on main), once the checks pass.
  # Auth is GitHub OIDC -> IAM role (bootstrap/), so no AWS keys are stored in GitHub.
  # Configuration lives in the `production` GitHub environment (docs/deployment.md); until
  # AWS_DEPLOY_ROLE_ARN is set there, the job skips the AWS steps and stays green.
  deploy:
    name: Deploy to AWS
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [build-and-test, infra]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_app_image_tag: ${{ github.sha }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check deploy configuration
        id: config
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::notice title=Deploy skipped::AWS_DEPLOY_ROLE_ARN is not set in the production environment. Run scripts/bootstrap.sh (see docs/deployment.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -z "$AWS_REGION" ] && missing="$missing AWS_REGION"
          [ -z "$STATE_BUCKET" ] && missing="$missing TF_STATE_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy misconfigured::Missing in the production environment:$missing"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'

      - name: Configure AWS credentials (OIDC)
        if: steps.config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.config.outputs.enabled == 'true'
        with:
          terraform_wrapper: false

      # The S3 backend is only added here, at deploy time, so local runs keep local state.
      - name: Terraform init (S3 remote state)
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          cat > ci_backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=nestjs-modular-monolith/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # The ECS service needs the image to exist, so the registry comes first (a no-op after the
      # first deploy), then the image is pushed, then the rest of the stack is applied.
      - name: Terraform apply (ECR repository)
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform apply -input=false -no-color -auto-approve -target=aws_ecr_repository.app 2>&1 | tee ecr.log

      - name: Build and push the image
        if: steps.config.outputs.enabled == 'true'
        run: |
          REPO=$(terraform -chdir=infra output -raw ecr_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build -t "$REPO:${{ github.sha }}" .
          docker push "$REPO:${{ github.sha }}"

      - name: Terraform plan
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.log

      - name: Terraform apply
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform apply -input=false -no-color tfplan 2>&1 | tee apply.log

      # Surface each Terraform "Error:" block as a run annotation, so failures are readable
      # from the run summary without downloading the raw log.
      - name: Report Terraform errors
        if: failure() && steps.config.outputs.enabled == 'true'
        working-directory: infra
        run: |
          for f in ecr.log plan.log apply.log; do
            [ -f "$f" ] || continue
            awk '{ gsub(/%/, "%25") }
                 /^Error: / { if (buf) print buf; buf = $0; n = 0; next }
                 buf && n < 15 { buf = buf "%0A" $0; n++ }
                 END { if (buf) print buf }' "$f" |
              while IFS= read -r block; do echo "::error title=Terraform ($f)::${block}"; done
          done

      - name: Wait for the ECS services
        if: steps.config.outputs.enabled == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform -chdir=infra output -raw ecs_cluster)" \
            --services $(terraform -chdir=infra output -json ecs_services | jq -r '.[]')

      - name: Smoke tests (real AWS)
        if: steps.config.outputs.enabled == 'true'
        run: |
          API=$(terraform -chdir=infra output -raw api_url)
          API_URL="$API" LOG_GROUP="/ecs/nest-monolith-app" scripts/smoke-test.sh
          {
            echo "### Deployed :rocket:"
            echo "REST: ${API}/v1 (e.g. ${API}/v1/users)"
            echo
            echo "GraphQL: ${API}/graphql"
          } >> "$GITHUB_STEP_SUMMARY"
